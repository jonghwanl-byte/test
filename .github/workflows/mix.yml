name: 혼합 비율 테스트

on:
  workflow_dispatch:
    inputs:
      rebalance:
        description: '혼합 리밸런싱'
        type: choice
        options: ['매월', '없음']
        default: '매월'

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy
      - run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          python mix.py ${{ inputs.rebalance == '없음' && '0' || '1' }} \
            | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
