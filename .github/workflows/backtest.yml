name: Backtest

# 예약 실행 없음 — Actions 탭에서 필요할 때만 수동 실행합니다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: "basic"
        options:
          - basic      # 지정한 밴드로 종목별 성과 계산
          - sweep      # 밴드 조합 그리드 서치 (학습/검증 분리)
          - stress     # 주요 하락 구간만 떼어내 방어력 비교
      years:
        description: "백테스트 기간 (년)"
        type: choice
        default: "10"
        options: ["3", "5", "10", "15"]
      band_up:
        description: "매수 문턱 (1.03 = MA +3%)"
        type: string
        default: "1.03"
      band_dn:
        description: "매도 문턱 (0.98 = MA -2%)"
        type: string
        default: "0.98"
      confirm_direction:
        description: "상태 전환 시 당일 방향 확인"
        type: boolean
        default: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::저장소 루트에 requirements.txt 가 없습니다."
            echo "현재 루트 파일 목록:"; ls -la
            exit 1
          fi
          pip install -r requirements.txt

      - name: 백테스트 실행
        env:
          TZ: Asia/Seoul
        run: |
          ARGS="--years ${{ inputs.years }}"
          if [ "${{ inputs.mode }}" = "sweep" ]; then
            ARGS="$ARGS --sweep"
          elif [ "${{ inputs.mode }}" = "stress" ]; then
            ARGS="$ARGS --stress --up ${{ inputs.band_up }} --dn ${{ inputs.band_dn }}"
          else
            ARGS="$ARGS --up ${{ inputs.band_up }} --dn ${{ inputs.band_dn }}"
          fi
          if [ "${{ inputs.confirm_direction }}" != "true" ]; then
            ARGS="$ARGS --no-confirm"
          fi
          echo "실행: python backtest.py $ARGS"
          python backtest.py $ARGS

      - name: 결과 파일 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.mode }}-${{ inputs.years }}y
          path: |
            backtest_result.csv
            sweep_result.csv
          if-no-files-found: warn
          retention-days: 30
