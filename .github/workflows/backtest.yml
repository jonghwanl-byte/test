name: gold-premium-backtest

on:
  workflow_dispatch:          # Actions 탭에서 수동 실행
  schedule:
    # 07:00 UTC = 16:00 KST (KRX 장 마감 15:30 이후). cron 은 항상 UTC 기준.
    - cron: "0 7 * * 1-5"

permissions:
  contents: write             # data.csv 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 데이터 갱신
        id: fetch
        continue-on-error: true      # KRX 차단 시 워크플로 전체를 죽이지 않음
        run: python fetch_krx_gold.py

      - name: 백테스트
        run: |
          if [ ! -f data.csv ]; then
            echo "::error::data.csv 가 없습니다. 수집이 실패했고 커밋된 데이터도 없습니다."
            exit 1
          fi
          python gold_premium_backtest.py data.csv \
            --split 2026-04-18 \
            --plot premium_backtest.png | tee report.txt

      - name: 결과 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backtest-${{ github.run_number }}
          path: |
            report.txt
            premium_backtest.png
          if-no-files-found: warn

      - name: 갱신된 데이터 커밋
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
