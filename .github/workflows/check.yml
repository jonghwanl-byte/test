name: 신호 진단

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '티커'
        required: false
        default: 'TLT'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: |
          python check.py ${{ inputs.ticker }} | tee -a $GITHUB_STEP_SUMMARY
